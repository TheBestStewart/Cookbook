<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting</title>
  <script>
    const loggedIn = localStorage.getItem("loggedIn");
    if (loggedIn === true) {
      window.location.replace("home.html");
    } else {
      window.location.replace("welcome.html")
    }
  </script>
</head>
<body>
</body>
</html>
