<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/plannerstyle.css">
</head>
<body>
    <header>
    <nav class="site-nav" aria-label="Main navigation">
    <span class="site-brand">Mise</span>
    <a href="cookbook.html" class="nav-link">Cookbook</a>
    <a href="planner.html" class="nav-link" aria-current="page">Planner</a>
            <button id="logout" type="button">Logout</button>
    </nav>
    </header>
    <main>
      <div class="planner-toolbar">
        <button id="recipe-search-toggle" type="button" aria-expanded="false" aria-controls="recipe-search-drawer">Recipe search</button>
        <div id="month" aria-label="Calendar controls">
          <h1>Meal Planner</h1>
          <div class="calendar-controls">
            <button type="button" id="previous" aria-label="Previous month">‹</button>
            <button type="button" id="today">Today</button>
            <button type="button" id="next" aria-label="Next month">›</button>
          </div>
        </div>
        <button id="grocery-toggle" type="button" aria-expanded="false" aria-controls="grocery-drawer">Grocery list</button>
      </div>

      <div class="planner-content recipe-search-collapsed grocery-collapsed">
        <aside id="recipe-search-drawer" class="planner-drawer recipe-search-drawer" aria-label="Recipe search">
          <h2>Recipe search</h2>
          <label for="planner-recipe-search">Search recipes</label>
          <input id="planner-recipe-search" type="search" placeholder="Search recipes...">
          <div id="planner-recipe-results" class="planner-recipe-results" aria-live="polite"></div>
        </aside>

        <section class="planner-main" aria-label="Meal calendar">
          <div id="calendar"></div>
          <section id="mobile-agenda" class="mobile-agenda" aria-label="Daily meal agenda"></section>
        </section>

        <aside id="grocery-drawer" class="planner-drawer grocery-drawer" aria-label="Grocery list">
          <h2>Grocery list</h2>
          <p>Ingredients to pick up for your planned meals.</p>
          <ul id="planner-grocery-list" class="grocery-list">
            <li>Chicken breasts</li>
            <li>Marinara sauce</li>
            <li>Mozzarella</li>
          </ul>
        </aside>

      </div>
    </main>
    <div id="calendar-trash" class="calendar-trash" aria-hidden="true">
  <span aria-hidden="true" id="trash"><img src="trash.svg"></span>
  <span id="trash-text">Delete items here</span>
</div>
<script>
    const calendar = document.getElementById("calendar");
    const monthTitle = document.querySelector("h1");
    const previousButton = document.getElementById("previous");
    const todayButton = document.getElementById("today");
    const nextButton = document.getElementById("next");
    const plannerContent = document.querySelector(".planner-content");
    const recipeSearchToggle = document.getElementById("recipe-search-toggle");
    const groceryToggle = document.getElementById("grocery-toggle");
    const mobileAgenda = document.getElementById("mobile-agenda");
    const plannerRecipeSearch = document.getElementById("planner-recipe-search");
    const plannerRecipeResults = document.getElementById("planner-recipe-results");
    const tog = document.getElementById("trash");
    const togl = document.getElementById("trash-text");
    let plannerRecipes = [];

    function normalizeSearchText(value) {
      return String(value || "").trim().toLowerCase();
    }

    function renderPlannerRecipeResults() {
      const searchText = normalizeSearchText(plannerRecipeSearch.value);
      const matchingRecipes = plannerRecipes.filter((recipe) => {
        const tags = Array.isArray(recipe.tags) ? recipe.tags : [];
        const searchableText = [
          recipe.title,
          recipe.name,
          recipe.description,
          ...tags
        ].join(" ").toLowerCase();

        return searchableText.includes(searchText);
      });

      plannerRecipeResults.replaceChildren();

      if (!searchText) return;

      if (!matchingRecipes.length) {
        const emptyMessage = document.createElement("p");
        emptyMessage.textContent = "No recipes found.";
        plannerRecipeResults.appendChild(emptyMessage);
        return;
      }

      matchingRecipes.forEach((recipe) => {
        const result = document.createElement("a");
        result.className = "planner-recipe-result";
        result.href = `cookbook.html?recipeId=${encodeURIComponent(recipe.id)}`;
        
        const title = document.createElement("strong");
        title.textContent = recipe.title || recipe.name || "Untitled recipe";
        result.appendChild(title);

        if (Array.isArray(recipe.tags) && recipe.tags.length) {
          const tags = document.createElement("span");
          tags.textContent = recipe.tags.join(", ");
          result.appendChild(tags);
        }
        result.draggable = true;

result.addEventListener("dragstart", (event) => {
  tog.classList.add("show");
  togl.classList.add("show");
  event.dataTransfer.effectAllowed = "copy";
  event.dataTransfer.setData(
    "application/x-cookbook-recipe",
    JSON.stringify(recipe)
  );
});
        plannerRecipeResults.appendChild(result);
      });
    }
    
    plannerRecipeSearch.addEventListener("input", renderPlannerRecipeResults);

    window.addEventListener("firebase-recipes-loaded", (event) => {
      plannerRecipes = event.detail;
      renderPlannerRecipeResults();
    });

    let displayedDate = new Date();

    function renderMobileAgenda() {
      mobileAgenda.replaceChildren();

      document.querySelectorAll(".day:not(.adjacent-month)").forEach((day) => {
        const entry = document.createElement("article");
        entry.className = "agenda-entry";

        const date = new Date(`${day.dataset.date}T12:00:00`);
        const dateHeading = document.createElement("h2");
        dateHeading.textContent = date.toLocaleDateString(undefined, {
          weekday: "long",
          month: "long",
          day: "numeric"
        });

        const meals = [...day.querySelectorAll(".calendar-item")];
        entry.appendChild(dateHeading);

        if (meals.length) {
          meals.forEach((meal) => {
            const mealText = document.createElement("p");
            mealText.className = "agenda-meal";
            mealText.textContent = meal.textContent;
            entry.appendChild(mealText);
          });
        } else {
          const emptyText = document.createElement("p");
          emptyText.className = "agenda-empty";
          emptyText.textContent = "No dinner planned";
          entry.appendChild(emptyText);
        }

        mobileAgenda.appendChild(entry);
      });
    }

    const calendarObserver = new MutationObserver(renderMobileAgenda);
    calendarObserver.observe(calendar, { childList: true, subtree: true });

    recipeSearchToggle.addEventListener("click", () => {
      const isCollapsed = plannerContent.classList.toggle("recipe-search-collapsed");
      if (!isCollapsed) {
        plannerContent.classList.add("grocery-collapsed");
        groceryToggle.setAttribute("aria-expanded", "false");
        groceryToggle.textContent = "Grocery list";
      }
      recipeSearchToggle.setAttribute("aria-expanded", String(!isCollapsed));
      recipeSearchToggle.textContent = isCollapsed ? "Recipe search" : "Hide";
    });

    groceryToggle.addEventListener("click", () => {
      const isCollapsed = plannerContent.classList.toggle("grocery-collapsed");
      if (!isCollapsed) {
        plannerContent.classList.add("recipe-search-collapsed");
        recipeSearchToggle.setAttribute("aria-expanded", "false");
        recipeSearchToggle.textContent = "Recipe search";
      }
      groceryToggle.setAttribute("aria-expanded", String(!isCollapsed));
      groceryToggle.textContent = isCollapsed ? "Grocery list" : "Hide";
    });

    function renderCalendar() {
      const year = displayedDate.getFullYear();
      const month = displayedDate.getMonth();

      const today = new Date();

      monthTitle.textContent = displayedDate.toLocaleString("default", {
        month: "long",
        year: "numeric"
      });

      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      calendar.replaceChildren();

      const weekdayRow = document.createElement("div");
      weekdayRow.className = "weekday-row";
      ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach((weekday) => {
        const weekdayLabel = document.createElement("div");
        weekdayLabel.textContent = weekday;
        weekdayLabel.setAttribute("aria-hidden", "true");
        weekdayRow.appendChild(weekdayLabel);
      });
      calendar.appendChild(weekdayRow);

      const firstCalendarDate = new Date(year, month, 1 - firstDayOfMonth);
      const calendarCellCount = Math.ceil((firstDayOfMonth + daysInMonth) / 7) * 7;
      let week = document.createElement("div");
      week.className = "week";

      for (let cellIndex = 0; cellIndex < calendarCellCount; cellIndex++) {
        const cellDate = new Date(firstCalendarDate);
        cellDate.setDate(firstCalendarDate.getDate() + cellIndex);

        const day = document.createElement("button");
        day.type = "button";
        day.className = "day";

        const dateValue = `${cellDate.getFullYear()}-${String(cellDate.getMonth() + 1).padStart(2, "0")}-${String(cellDate.getDate()).padStart(2, "0")}`;
        day.dataset.date = dateValue;
        day.setAttribute("aria-label", day.dataset.date);
        day.addEventListener("dragover", (event) => {
  const types = event.dataTransfer.types;
  tog.classList.toggle("show");
  togl.classList.toggle("show");

  if (
    types.includes("application/x-cookbook-recipe") ||
    types.includes("application/x-cookbook-meal-plan")
  ) {
    event.preventDefault();
    event.dataTransfer.dropEffect =
      types.includes("application/x-cookbook-meal-plan")
        ? "move"
        : "copy";

    day.classList.add("drag-over");
  }
});

day.addEventListener("dragleave", () => {
  day.classList.remove("drag-over");
  tog.classList.remove("show");
  togl.classList.remove("show");
});

day.addEventListener("drop", (event) => {
  event.preventDefault();
  day.classList.remove("drag-over");
  tog.classList.remove("show");
  togl.classList.remove("show");

  try {
    const mealPlanData = event.dataTransfer.getData(
      "application/x-cookbook-meal-plan"
    );

    if (mealPlanData) {
      const { mealPlanId } = JSON.parse(mealPlanData);

      window.dispatchEvent(
        new CustomEvent("meal-plan-dropped-on-calendar", {
          detail: {
            mealPlanId,
            date: day.dataset.date
          }
        })
      );

      return;
    }

    const recipeData = event.dataTransfer.getData(
      "application/x-cookbook-recipe"
    );

    if (recipeData) {
      const recipe = JSON.parse(recipeData);

      window.dispatchEvent(
        new CustomEvent("recipe-dropped-on-calendar", {
          detail: {
            recipe,
            date: day.dataset.date
          }
        })
      );
    }
  } catch (error) {
    console.error("Could not process calendar drop:", error);
  }
});
        if (cellDate.getMonth() !== month) {
          day.classList.add("adjacent-month");
        }

        const paragraph = document.createElement("p");
        paragraph.textContent = cellDate.getDate();

        const isToday =
          cellDate.getDate() === today.getDate() &&
          cellDate.getMonth() === today.getMonth() &&
          cellDate.getFullYear() === today.getFullYear();

        if (isToday) {
          day.classList.add("today");
        }

        day.appendChild(paragraph);
        week.appendChild(day);

        // Start a new week after Saturday
        if (week.children.length === 7) {
          calendar.appendChild(week);
          week = document.createElement("div");
          week.className = "week";
        }
      }

      window.dispatchEvent(new CustomEvent("calendar-rendered"));
      renderMobileAgenda();
    }

    function updateTodayHighlight() {
      const today = new Date();
      const todayDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;

      document.querySelectorAll(".day").forEach((day) => {
        day.classList.toggle("today", day.dataset.date === todayDate);
      });
    }

    previousButton.addEventListener("click", () => {
      displayedDate.setDate(1);
      displayedDate.setMonth(displayedDate.getMonth() - 1);
      renderCalendar();
    });

    todayButton.addEventListener("click", () => {
      displayedDate = new Date();
      renderCalendar();
    });

    nextButton.addEventListener("click", () => {
      displayedDate.setDate(1);
      displayedDate.setMonth(displayedDate.getMonth() + 1);
      renderCalendar();
    });
    renderCalendar();
    const calendarTrash = document.getElementById("calendar-trash");

window.addEventListener("calendar-item-drag-start", () => {
  calendarTrash.classList.add("visible");
  calendarTrash.setAttribute("aria-hidden", "false");
  tog.classList.add("show");
  togl.classList.add("show");
});

window.addEventListener("calendar-item-drag-end", () => {
  calendarTrash.classList.remove("visible", "drag-over");
  calendarTrash.setAttribute("aria-hidden", "true");
  tog.classList.remove("show");
  togl.classList.remove("show");
});

calendarTrash.addEventListener("dragover", (event) => {
  if (event.dataTransfer.types.includes("application/x-cookbook-meal-plan")) {
    event.preventDefault();
    event.dataTransfer.dropEffect = "move";
    calendarTrash.classList.add("drag-over");
  tog.classList.remove("show");
  togl.classList.remove("show");
  }
});

calendarTrash.addEventListener("dragleave", () => {
  calendarTrash.classList.remove("drag-over");
  tog.classList.remove("show");
  togl.classList.remove("show");
});

calendarTrash.addEventListener("drop", (event) => {
  event.preventDefault();
  calendarTrash.classList.remove("visible", "drag-over");
  tog.classList.remove("show");
  togl.classList.remove("show");

  const data = event.dataTransfer.getData(
    "application/x-cookbook-meal-plan"
  );

  if (!data) return;

  const { mealPlanId } = JSON.parse(data);

  window.dispatchEvent(
    new CustomEvent("delete-meal-plan", {
      detail: { mealPlanId }
    })
  );
});
window.dispatchEvent(
  new CustomEvent("delete-meal-plan", {
    detail: { mealPlanId }
  })
);
window.addEventListener("delete-meal-plan", async (event) => {
  const { mealPlanId } = event.detail || {};

  if (!mealPlanId) return;

  try {
    await deleteDoc(doc(db, "mealPlans", mealPlanId));
  } catch (error) {
    console.error("Could not delete meal plan:", error);
    alert("The planned recipe could not be removed.");
  }
});
    // Refresh only the current-day styling so planned items remain in place.
    setInterval(updateTodayHighlight, 60 * 1000);
</script>
<script type="module" src="scripts/script.js"></script>
</body>
</html>
