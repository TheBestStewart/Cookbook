<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookbook</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/cookbook.css">
</head>

<body>
    <header>
        <nav class="site-nav" aria-label="Main navigation">
            <span class="site-brand">Cookbook</span>
            <a href="cookbook.html" aria-current="page">Cookbook</a>
            <a href="planner.html">Planner</a>
            <button id="logout" type="button">Logout</button>
        </nav>
    </header>

    <main class="cookbook-page">
        <section class="search-section" aria-label="Recipe search">
            <button id="filters-toggle" type="button" aria-expanded="false" aria-controls="recipe-filters">
                <span class="toggle-label">Filters</span>
            </button>
            <input id="recipe-search" type="search" placeholder="Search recipes...">
            <button id="add-recipe-toggle" type="button" aria-expanded="false" aria-controls="add-recipe-panel">
                <span aria-hidden="true">+</span> <span class="add-recipe-label">Add recipe</span>
            </button>
        </section>

        <div class="cookbook-content filters-collapsed add-recipe-collapsed">
            <div class="filters-drawer-wrapper">
                <div class="filters-drawer">
                    <aside id="recipe-filters" class="filters" aria-label="Recipe filters">
                <h2>Filters</h2>
                <div class="filter-group">
                    <h3>Main protein</h3>
                    <label><input class="tag-filter" data-filter-group="protein" type="checkbox" value="beef"> Beef</label>
                    <label><input class="tag-filter" data-filter-group="protein" type="checkbox" value="chicken"> Chicken</label>
                    <label><input class="tag-filter" data-filter-group="protein" type="checkbox" value="pork"> Pork</label>
                </div>
                <div class="filter-group">
                    <h3>Main carb</h3>
                    <label><input class="tag-filter" data-filter-group="carb" type="checkbox" value="rice"> Rice</label>
                    <label><input class="tag-filter" data-filter-group="carb" type="checkbox" value="bread"> Bread</label>
                    <label><input class="tag-filter" data-filter-group="carb" type="checkbox" value="pasta"> Pasta</label>
                    <label><input class="tag-filter" data-filter-group="carb" type="checkbox" value="potatoes"> Potatoes</label>
                </div>
                <div class="filter-group">
                    <h3>Appliance</h3>
                    <label><input class="tag-filter" data-filter-group="appliance" type="checkbox" value="stovetop"> Stovetop</label>
                    <label><input class="tag-filter" data-filter-group="appliance" type="checkbox" value="oven"> Oven</label>
                    <label><input class="tag-filter" data-filter-group="appliance" type="checkbox" value="slow cooker"> Slow Cooker</label>
                    <label><input class="tag-filter" data-filter-group="appliance" type="checkbox" value="microwave"> Microwave</label>
                </div>
                <div class="filter-group">
                    <h3>Main flavor</h3>
                    <label><input class="tag-filter" data-filter-group="flavor" type="checkbox" value="sweet"> Sweet</label>
                    <label><input class="tag-filter" data-filter-group="flavor" type="checkbox" value="salty"> Salty</label>
                    <label><input class="tag-filter" data-filter-group="flavor" type="checkbox" value="sour"> Sour</label>
                    <label><input class="tag-filter" data-filter-group="flavor" type="checkbox" value="rich"> Rich</label>
                </div>
                    </aside>

                </div>
            </div>

            <section id="recipe-grid" class="recipe-grid" aria-label="Recipes"></section>

            <div class="add-recipe-drawer-wrapper">
                <div class="add-recipe-drawer">
                    <aside id="add-recipe-panel" class="add-recipe-panel" aria-label="Add a new recipe">
                        <h2>Add recipe</h2>
                        <section class="recipe-url-import" aria-labelledby="recipe-url-heading">
                            <h3 id="recipe-url-heading">Import from URL</h3>
                            <input id="new-recipe-url" name="recipeUrl" type="url" placeholder="https://example.com/recipe">
                        </section>
                        <form id="form">
                            <label for="recipe-name">Recipe name</label>
                            <input id="recipe-name" name="title" type="text" required>

                            <label for="image">Image URL</label>
                            <input id="image" name="image" type="url" value="https://toppng.com/uploads/preview/clipart-free-seaweed-clipart-draw-food-placeholder-11562968708qhzooxrjly.png">

                            <label for="source">Recipe Source</label>
                            <input id="source" type="url">

                            <label for="tags">Tags</label>
                            <input id="tags" name="tags" type="text" placeholder="Beef, Rice, Oven, Rich">

                            <label for="description">Description</label>
                            <textarea id="description" name="description" rows="3"></textarea>

                            <div class="add-recipe-time-fields">
                                <div>
                                    <label for="prep-time">Prep time</label>
                                    <input id="prep-time" name="prepTime" type="text">
                                </div>
                                <div>
                                    <label for="cook-time">Cook time</label>
                                    <input id="cook-time" name="cookTime" type="text">
                                </div>
                                <div>
                                    <label for="total-time">Total time</label>
                                    <input id="total-time" name="totalTime" type="text" required>
                                </div>
                            </div>

                            <label for="servings">Servings</label>
                            <input id="servings" name="servings" type="number" min="1">

                            <label for="ingredients">Ingredients</label>
                            <textarea id="ingredients" name="ingredients" rows="6" placeholder="One ingredient per line" required></textarea>

                            <label for="instructions">Instructions</label>
                            <textarea id="instructions" name="instructions" rows="7" placeholder="One step per line"></textarea>

                            <label for="notes">Notes</label>
                            <textarea id="notes" name="notes" rows="3"></textarea>

                            <button type="submit">Create recipe</button>
                        </form>
                    </aside>
                </div>
            </div>
        </div>
    </main>

    <div id="recipe-overlay" class="recipe-overlay" hidden aria-hidden="true">
        <div class="recipe-dialog">
            <div class="recipe-overlay-bar">
                <button id="edit-recipe" type="button">Edit Recipe</button>
                <button id="delete-recipe" type="button">Delete Recipe</button>
                <button class="recipe-close" type="button" data-close-overlay aria-label="Close recipe">×</button>
            </div>
            <article class="recipe-window" role="dialog" aria-modal="true" aria-labelledby="recipe-title">
                <section class="recipe-picture" aria-label="Recipe picture">
                    <img id="recipe-image" alt="">
                </section>
                <section class="recipe-header">
                    <h2 id="recipe-title">Sample Recipe</h2>
                    <p id="recipe-tags">Tags: Tag one, Tag two</p>
                    <p id="recipe-description">Recipe description.</p>
                    <p id="recipe-prep-time">Prep time: 30 minutes</p>
                    <p id="recipe-cook-time">Cook time: 30 minutes</p>
                    <p id="recipe-total-time">Total time: 60 minutes</p>
                    <p id="recipe-serving-size">Serves: 4</p>
                </section>
                <section class="recipe-ingredients">
                    <h3>Ingredients</h3>
                    <div id="recipe-ingredients-list"></div>
                </section>
                <section class="recipe-instructions">
                    <h3>Instructions</h3>
                    <div id="recipe-instructions-list"></div>
                    <div id="recipe-notes"></div>
                </section>
            </article>
        </div>
    </div>

    <div
  id="meal-planner-popover"
  class="meal-planner-popover"
  hidden
>
  <h2 id="meal-planner-title">Plan recipe</h2>

  <form id="meal-plan-form">
    <label for="meal-plan-date">Choose a date</label>

    <input id="meal-plan-date" type="date" required>

    <button id="meal-planner-cancel" type="button">
      Cancel
    </button>

    <button id="confirm-button" type="submit">
      Confirm
    </button>
  </form>
</div>

<script>
    let recipes = [];

    const recipeGrid = document.querySelector('#recipe-grid');
    const overlay = document.querySelector('#recipe-overlay');
    const recipeTitle = document.querySelector('#recipe-title');
    const recipeTags = document.querySelector('#recipe-tags');
    const recipeImage = document.querySelector('#recipe-image');
    const recipeDescription = document.querySelector('#recipe-description');
    const recipePrepTime = document.querySelector('#recipe-prep-time');
    const recipeCookTime = document.querySelector('#recipe-cook-time');
    const recipeTotalTime = document.querySelector('#recipe-total-time');
    const recipeServingSize = document.querySelector('#recipe-serving-size');
    const recipeIngredients = document.querySelector('#recipe-ingredients-list');
    const recipeInstructions = document.querySelector('#recipe-instructions-list');
    const recipeNotes = document.querySelector('#recipe-notes');
    const filtersToggle = document.querySelector('#filters-toggle');
    const addRecipeToggle = document.querySelector('#add-recipe-toggle');
    const addRecipeLabel = addRecipeToggle.querySelector('.add-recipe-label');
    const cookbookContent = document.querySelector('.cookbook-content');
    const mealPlannerPopover = document.querySelector('#meal-planner-popover');
    const mealPlannerTitle = document.querySelector('#meal-planner-title');
    const mealPlanDate = document.querySelector('#meal-plan-date');
    const mealPlannerCancel = document.querySelector('#meal-planner-cancel');
    const searchInput = document.querySelector('#recipe-search');
    const tagFilters = document.querySelectorAll('.tag-filter');

    const normalizeTag = (tag) => String(tag || '').trim().toLowerCase();

    const getFilteredRecipes = () => {
      const searchText = searchInput.value.trim().toLowerCase();
      const selectedTags = [...tagFilters]
        .filter((checkbox) => checkbox.checked)
        .reduce((groups, checkbox) => {
          const group = checkbox.dataset.filterGroup;
          if (!groups[group]) groups[group] = [];
          groups[group].push(normalizeTag(checkbox.value));
          return groups;
        }, {});

      return recipes.filter((recipe) => {
        const recipeTags = Array.isArray(recipe.tags)
          ? recipe.tags.map(normalizeTag)
          : [];
        const searchableText = [recipe.title, recipe.description, ...recipeTags]
          .join(' ')
          .toLowerCase();

        const matchesFilters = Object.values(selectedTags).every((tags) =>
          tags.some((tag) => recipeTags.includes(tag))
        );

        return matchesFilters
          && searchableText.includes(searchText);
      });
    };

    const closeMealPlanner = () => {
      mealPlannerPopover.hidden = true;
    };

    const openMealPlanner = (recipe, button) => {
        window.selectedRecipe = recipe;
      mealPlannerTitle.textContent = 'Plan ' + recipe.title;
      mealPlanDate.value = '';
      mealPlannerPopover.hidden = false;

      const buttonBounds = button.getBoundingClientRect();
      const popoverWidth = mealPlannerPopover.offsetWidth;
      const left = Math.min(
        buttonBounds.right - popoverWidth,
        window.innerWidth - popoverWidth - 16
      );
      mealPlannerPopover.style.left = Math.max(16, left) + 'px';
      mealPlannerPopover.style.top = Math.min(
        buttonBounds.bottom + 8,
        window.innerHeight - mealPlannerPopover.offsetHeight - 16
      ) + 'px';
    };
function linesToSections(value, itemName) {
  if (Array.isArray(value)) {
    return value;
  }

  return [
    {
      group: itemName,
      items: String(value || "")
        .split("\n")
        .map((line) => line.trim())
        .filter(Boolean)
    }
  ];
}

function openRecipeDetails(recipe) {
  window.selectedRecipe = recipe;

  recipeTitle.textContent = recipe.title;

  recipeTags.textContent =
    "Tags: " + (recipe.tags || []).join(", ");

  recipeImage.src = recipe.image || "";
  recipeImage.alt = recipe.title;
  recipeImage.hidden = !recipe.image;

  recipeDescription.textContent =
    recipe.description || "";

  recipePrepTime.textContent =
    "Prep time: " + (recipe.prepTime || "");

  recipeCookTime.textContent =
    "Cook time: " + (recipe.cookTime || "");

  recipeTotalTime.textContent =
    "Total time: " + (recipe.totalTime || "");

  recipeServingSize.textContent =
    "Serves: " + (recipe.servings || "");

  const ingredients = linesToSections(
    recipe.ingredients,
    "Ingredients"
  );

  recipeIngredients.innerHTML = ingredients
    .map(
      (section) =>
        `<h4>${section.group}</h4>
         <ul>
           ${section.items
             .map((item) => `<li>${item}</li>`)
             .join("")}
         </ul>`
    )
    .join("");

  const instructions = linesToSections(
    recipe.instructions,
    "Instructions"
  );

  recipeInstructions.innerHTML = instructions
    .map(
      (section) =>
        `<h4>${section.group}</h4>
         <ol>
           ${section.items
             .map((item) => `<li>${item}</li>`)
             .join("")}
         </ol>`
    )
    .join("");

  recipeNotes.textContent = recipe.notes || "";

  overlay.hidden = false;
  overlay.setAttribute("aria-hidden", "false");
}
function renderRecipes() {
  recipeGrid.replaceChildren();

  getFilteredRecipes().forEach((recipe) => {
    const card = document.createElement("article");

    card.className = "recipe-card";

    card.innerHTML = `
      <button class="recipe-open" type="button">
        <img
          class="recipe-image"
          src="${recipe.image || ""}"
          alt="${recipe.title || ""}"
        >

        <span class="recipe-card-text">
          <h3>${recipe.title || "Untitled recipe"}</h3>
          <p>${recipe.totalTime || ""}</p>
        </span>
      </button>

      <button
        class="recipe-plan"
        type="button"
        aria-label="Plan recipe"
      >
        +
      </button>
    `;

    card.addEventListener("click", (event) => {
      if (event.target.closest(".recipe-plan")) {
        return;
      }

      openRecipeDetails(recipe);
    });

    card.querySelector(".recipe-plan").addEventListener("click", (event) => {
      event.stopPropagation();
      openMealPlanner(recipe, event.currentTarget);
    });

    recipeGrid.appendChild(card);
  });
}

    tagFilters.forEach((checkbox) => {
      checkbox.addEventListener('change', renderRecipes);
    });
    searchInput.addEventListener('input', renderRecipes);
window.addEventListener("firebase-recipes-loaded", (event) => {
  recipes = event.detail;
  renderRecipes();

  const recipeId = new URLSearchParams(window.location.search)
    .get("recipeId");

  if (!recipeId) return;

  const recipe = recipes.find((item) => item.id === recipeId);

  if (recipe) {
    openRecipeDetails(recipe);
  } else {
    console.error("Recipe not found:", recipeId);
  }
});

    filtersToggle.addEventListener('click', () => {
      const collapsed = cookbookContent.classList.toggle('filters-collapsed');

      if (!collapsed) {
        cookbookContent.classList.add('add-recipe-collapsed');
        addRecipeToggle.setAttribute('aria-expanded', 'false');
        addRecipeLabel.textContent = 'Add recipe';
      }

      filtersToggle.setAttribute('aria-expanded', String(!collapsed));
      filtersToggle.querySelector('.toggle-label').textContent = collapsed ? 'Filters' : 'Hide';
    });

    addRecipeToggle.addEventListener('click', () => {
      const collapsed = cookbookContent.classList.toggle('add-recipe-collapsed');

      if (!collapsed) {
        cookbookContent.classList.add('filters-collapsed');
        filtersToggle.setAttribute('aria-expanded', 'false');
        filtersToggle.querySelector('.toggle-label').textContent = 'Filters';
      }

      addRecipeToggle.setAttribute('aria-expanded', String(!collapsed));
      addRecipeLabel.textContent = collapsed ? 'Add recipe' : 'Hide';
    });

    const closeOverlay = () => {
      overlay.hidden = true;
      overlay.setAttribute('aria-hidden', 'true');
    };
    document.querySelector('[data-close-overlay]').addEventListener('click', closeOverlay);
    mealPlannerCancel.addEventListener('click', closeMealPlanner);
    document.addEventListener('click', (event) => {
      if (!mealPlannerPopover.hidden && !event.target.closest('#meal-planner-popover, .recipe-plan')) {
        closeMealPlanner();
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeOverlay();
        closeMealPlanner();
      }
    });
  </script>
<script type="module" src="scripts/script.js"></script>
</body>

</html>
